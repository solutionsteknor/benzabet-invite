<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>Benzabet Ultimate</title>
<style>
:root{color-scheme:dark;--ink:#edf6f6;--muted:#b9c8ce;--line:#34464d;--cyan:#18e4e9}
*{box-sizing:border-box}
body{margin:0;background:#080e12;color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(100% - 32px,540px);margin:clamp(36px,11vh,130px) auto}
header{display:flex;align-items:center;gap:14px;margin:0 0 26px}
.brand{font:700 24px/1.1 Georgia,serif;letter-spacing:.035em;color:#f2f6fa}
.tier{border-left:1px solid #46555c;padding-left:14px;color:var(--cyan);font-size:12px;font-weight:750;letter-spacing:.2em}
.card{background:#111b20;border:1px solid var(--line);border-top:3px solid var(--cyan);border-radius:16px;padding:clamp(23px,5vw,38px)}
h1{margin:0 0 12px;line-height:1.12;font-size:clamp(28px,5vw,40px);letter-spacing:-.045em}
h1:focus{outline:none}
p{color:var(--muted);margin:0}
strong{color:var(--ink)}
button{margin-top:20px;font:inherit;font-weight:700;cursor:pointer;color:#000;background:var(--cyan);border:0;border-radius:10px;min-height:48px;padding:10px 22px}
button:hover{background:#66f2f5}
button:focus-visible{outline:3px solid #fff;outline-offset:4px}
[hidden]{display:none}
</style>
<noscript><style>#text{display:none}</style></noscript>
</head>
<body>
<main>
<header><span class="brand">BENZABET</span><span class="tier">ULTIMATE</span></header>
<section class="card">
<h1 id="title" tabindex="-1">Benzabet Ultimate</h1>
<p id="text">Use the buttons in your invitation email to answer.</p>
<noscript><p>Your answer could not be saved because scripts are switched off in this browser. Please open the link in another browser.</p></noscript>
<button type="button" id="go" hidden>Unsubscribe</button>
</section>
</main>
<script>
(function () {
  // Where answers are recorded: the Google Sheet's script. Players never see this address.
  var RECORD_URL = 'https://script.google.com/macros/s/AKfycbxUNRhIGC0sv59LzfFwYGaQBRSEH0HBKqqA6Xyf7wePKTnGXrUMwQQiDKWpfW4Khdml/exec';
  var LABELS = { claim: 'Claim my spot', maybe: 'Maybe', no: 'No' };
  var WAITS = [1500, 3000, 6000, 12000, 24000];

  var params = new URLSearchParams(location.search);
  var token = params.get('t') || '';
  // A few mail apps turn the "&" in a link into "&amp;", which arrives as a parameter named "amp;a".
  var action = params.get('a') || params.get('amp;a') || '';
  var title = document.getElementById('title');
  var text = document.getElementById('text');
  var button = document.getElementById('go');

  function known(name) { return Object.prototype.hasOwnProperty.call(LABELS, name); }

  function show(heading, body, strong) {
    title.textContent = heading;
    document.title = heading.replace(/[.?]$/, '') + ' | Benzabet Ultimate';
    text.textContent = body;
    if (strong) {
      var mark = document.createElement('strong');
      mark.textContent = strong;
      text.appendChild(mark);
      text.appendChild(document.createTextNode('.'));
    }
  }
  function thanks(name) { show('Thank you for answering.', 'Your answer: ', LABELS[name]); }

  // Once an answer has been saved, the private token is taken out of the address (see forget).
  // A tab reopened or reloaded later then shows the thank-you again without sending anything,
  // so an old tab can never overwrite a newer answer.
  if (params.get('done') === '1' && known(action)) { thanks(action); return; }

  if (!/^[0-9a-f]{32}$/.test(token)) {
    if (known(action) || action === 'unsub') show('This link is incomplete.', 'Please press the button in the email again.');
    return;
  }

  // Sent without cookies, so it works the same whether or not the player is signed in to Google.
  function record(what, attempt, onSaved, onFailed) {
    fetch(RECORD_URL + '?t=' + token + '&a=' + what, {
      method: 'POST', mode: 'no-cors', credentials: 'omit', cache: 'no-store', keepalive: true, body: 'r=1'
    }).then(function () {
      if (onSaved) onSaved();
    }, function () {
      if (attempt < WAITS.length) setTimeout(function () { record(what, attempt + 1, onSaved, onFailed); }, WAITS[attempt]);
      else if (onFailed) onFailed();
    });
  }
  function forget(what) {
    try { history.replaceState(null, '', location.pathname + '?a=' + what + '&done=1'); } catch (e) { /* old browser: nothing to do */ }
  }

  // Mail security scanners open links without showing them to anyone. Record only once a
  // person can actually see the page, so a scanner does not answer for the player.
  function whenSeen(run) {
    if (navigator.webdriver) return;
    var done = false;
    function check() {
      if (done || document.visibilityState !== 'visible') return;
      done = true;
      setTimeout(run, 300);
    }
    document.addEventListener('visibilitychange', check);
    check();
  }

  if (known(action)) {
    thanks(action);
    whenSeen(function () { record(action, 0, function () { forget(action); }); });
  } else if (action === 'unsub') {
    show('Unsubscribe?', 'Stop Benzabet Ultimate emails to this address.');
    button.hidden = false;
    button.addEventListener('click', function () {
      button.hidden = true;
      show('One moment...', '');
      title.focus();
      record('unsub', 0, function () {
        show('You are unsubscribed.', 'You will not get more Benzabet Ultimate emails at this address.');
        title.focus();
      }, function () {
        show('Unsubscribe?', 'We could not save this just now. Please try again.');
        button.hidden = false;
        button.focus();
      });
    });
  }
})();
</script>
</body>
</html>
